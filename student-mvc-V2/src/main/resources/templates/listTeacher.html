<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="template4">
<head>
    <meta charset="UTF-8">
    <title>Consult teachert</title>
</head>
<body>
<div layout:fragment="content1">

    <div class="container rounded bg-white mt-5 mb-5">
        <div class="row">
            <div class="col-md-3 border-right">
                <div class="d-flex flex-column align-items-center text-center p-3 py-5">
                    <img class="rounded-circle mt-5" width="150px" src="https://upload.wikimedia.org/wikipedia/commons/1/1c/Teacher_%2828111%29_-_The_Noun_Project.svg"><span class="font-weight-bold"><label th:text="${teacher.nom}"></label></span><span class="text-black-50"><label th:text="${teacher.email}"></label></span><span> </span></div>
            </div>
            <div class="col-md-5 border-right">
                <div class="p-3 py-5">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="text-right">Consult teacher's information</h4>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12"><label class="labels">ID : </label>
                            <label th:text="${teacher.id}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Firstname : </label>
                            <label th:text="${teacher.nom}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Lastname : </label>
                            <label th:text="${teacher.prenom}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Lastname : </label>
                            <label th:text="${teacher.genre}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Email : </label>
                            <label th:text="${teacher.email}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Birth Date : </label>
                            <label th:text="${teacher.dateNaissance}"></label>
                        </div>
                        <div class="col-md-12"><label class="labels">Status :  </label>
                            <label th:text="${teacher.enRegle}"></label>
                        </div>
                    </div>

                    <div class="mt-5 text-center">
                        <a class="btn btn-outline-primary" th:href="@{/user/teachers(id=${teacher.id}, keyword=${keyword}, page=${page})}">
                            <i class="fas fa-arrow-alt-circle-left"></i>
                        </a>
                        <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-warning"
                           th:href="@{/admin/editteacher(id=${teacher.id})}"><i
                                class="fas fa-user-edit"></i></a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</div>
</body>
</html>
