<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="template4">
<head>
  <meta charset="UTF-8">
  <title>Update Subject</title>

</head>
<body>
<div layout:fragment="content1">


    <div class="container rounded bg-white mt-5 mb-5">
      <div class="row">

        <div class="col-md-3 border-right">
          <div class="d-flex flex-column align-items-center text-center p-3 py-5">
            <img class="rounded-circle mt-5" width="150px" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/OOjs_UI_icon_speechBubbles-ltr.svg/640px-OOjs_UI_icon_speechBubbles-ltr.svg.png"><span class="font-weight-bold"><label th:text="${subject.nom}"></label></span><span class="text-black-50"><label th:text="${subject.description}"></label></span><span> </span></div>
        </div>
        <form method="post" th:action="@{/admin/save-Subject(page=${page},keyword=${keyword})}">

        <div class="col-md-5 border-right">
          <div class="p-3 py-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h4 class="text-right">Consult subject's information</h4>
            </div>
            <div class="row mt-3">
              <div class="col-md-12">
                <label class="labels">ID : </label>
                <label class="control-label" th:text="${subject.id}"></label>
                <input class="form-control" name="id" type="hidden" th:value="${subject.id}">
              </div>
              <div class="col-md-12"><label class="labels">Name : </label>
                <input class="form-control" name="nom" type="text" th:value="${subject.nom}">
                <span th:errors="${subject.nom}" class="text-danger"></span>
              </div>
              <div class="col-md-12"><label class="labels">Description : </label>
                <input class="form-control" name="description" type="text" th:value="${subject.description}">
                <span th:errors="${subject.description}" class="text-danger"></span>
              </div>
            </div>

            <div class="mt-5 text-center">
              <a class="btn btn-outline-primary" th:href="@{/user/subjects(id=${subject.id}, keyword=${keyword}, page=${page})}">
                <i class="fas fa-arrow-alt-circle-left"></i>
              </a>
              <button onclick="swal('Well Update!', 'You update this subject!', 'success')" type="submit" class="btn btn-outline-primary"><i class="fas fa-save"></i></button>
            </div>

          </div>
        </div>
        </form>

  <div class="col-md-4">
          <div class="p-3 py-5">
            <div class="d-flex justify-content-between align-items-center experience">
              <span></span>
              <form th:action="@{/chapter/upload/{id}(id=${subject.id})}" method="POST" enctype="multipart/form-data">
                <input type="file" id="fileInput" name="file" accept="application/pdf" class="form-control" />
                <button type="submit" class="btn btn-primary mt-2">Upload</button>
              </form>
            </div>
            <br>

          </div>
        </div>

        <!-- PDF Modal -->
        <div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="pdfModalLabel">PDF Viewer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <iframe id="pdfViewer" src="" width="100%" height="500px"></iframe>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>


</div>

</body>
</html>
